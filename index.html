<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palazki University Entrance Exam Registration</title>
    <script>
        let script = document.createElement("script");
        script.src = "https://www.paypal.com/sdk/js?client-id=AbPk5BIM6yZ1BCU7sosLghs1UHBILXcnFGiwiQXK9CY3odq1_pan8w0jL-kojdYdKLOHvv0ce5qhGreR&currency=USD";
        script.onload = function() {
            console.log("PayPal SDK Loaded!");
            if (typeof paypal !== "undefined") {
                loadPayPalButtons();
            } else {
                console.error("PayPal SDK failed to initialize.");
            }
        };
        script.onerror = function() {
            console.error("Failed to load PayPal SDK!");
        };
        document.head.appendChild(script);
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 20px;
            background: white;
            color: black;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            color: black;
        }
        h2, h3 {
            color: black;
        }
        form {
            text-align: left;
        }
        label {
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .success-message {
            color: green;
            display: none;
            font-weight: bold;
        }
        .error-message {
            color: red;
            display: none;
            font-weight: bold;
        }
        .paypal-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Palazki University Entrance Exam</h2>
        <p>Register now for the entrance exam and secure your spot!</p>
        <form id="registrationForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
            
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            
            <label for="passport">Passport Number</label>
            <input type="text" id="passport" placeholder="Enter your passport number" required>
        </form>
        
        <h3>Exam Fee: $70</h3>
        <p>Proceed with the payment to complete your registration.</p>
        <div class="paypal-container" id="paypal-button-container"></div>
        <p class="success-message" id="successMessage">✅ Payment successful! Thank you for registering.</p>
        <p class="error-message" id="errorMessage">❌ Payment failed. Please try again.</p>
    </div>

    <script>
        document.getElementById('passport').addEventListener('input', function() {
            this.value = this.value.toUpperCase().trim();
        });
        
        function loadPayPalButtons() {
            if (typeof paypal === "undefined") {
                console.error("PayPal SDK failed to load!");
                return;
            }

            paypal.Buttons({
                createOrder: function(data, actions) {
                    return actions.order.create({
                        purchase_units: [{
                            amount: {
                                value: '70.00'
                            }
                        }]
                    });
                },
                onApprove: function(data, actions) {
                    return actions.order.capture().then(function(details) {
                        const userDetails = JSON.parse(localStorage.getItem("userDetails")) || {};

                        fetch('/submit-registration', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...userDetails, transactionID: details.id })
                        }).then(response => response.json())
                          .then(data => console.log("Registration saved:", data))
                          .catch(error => console.error("Error saving registration:", error));

                        alert("Transaction completed by " + details.payer.name.given_name);
                        document.getElementById("successMessage").style.display = "block";
                    });
                },
                onError: function(err) {
                    console.error("Payment failed", err);
                    alert("Payment failed. Please check your PayPal account or try again.");
                    document.getElementById("errorMessage").style.display = "block";
                }
            }).render('#paypal-button-container');
        }
    </script>
</body>
</html>
